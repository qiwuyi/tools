<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SQL IN 转换器 · Tools</title>
<link rel="stylesheet" href="shell.css">
<style>
:root{--dim:#a0adbd;--accent2:var(--accent)}
main{padding:16px 24px}
.sub{margin-bottom:8px}
.bar{margin:8px 0;padding:8px 16px;gap:8px 16px}
.wrap textarea,.wrap .out{min-height:200px;height:clamp(200px,calc(100dvh - 296px),520px);flex:none;overflow:auto}
.pane header{min-height:40px}
#copy{min-height:32px;min-width:64px}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
textarea:focus-visible{outline-offset:-4px}
.quote-options{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--dim);font-size:12px}
.quote-options label{min-height:32px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.quote-options label:has(:checked){border-color:var(--accent);background:#1c2530}
.quote-options label:hover{border-color:var(--accent)}
.quote-options input{accent-color:var(--accent);margin:0}
.quote-options input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
@media(max-width:760px){
  main{padding:16px}.quote-options label,#copy{min-height:44px}
  .wrap textarea,.wrap .out{height:200px;font-size:15px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand"><b>TOOLS</b> 工具箱</div>
    <a href="index.html"><span class="tag">⌂</span>全部工具</a>
    <a href="sql-in.html" class="on"><span class="tag">SQL</span>IN 转换器</a>
    <a href="json.html"><span class="tag">{}</span>JSON 格式化</a>
    <a href="url.html"><span class="tag">%</span>URL 转义</a>
    <a href="timestamp.html"><span class="tag">T</span>时间戳转换</a>
    <div class="foot">单文件 / 纯本地<br>无依赖 · 无上传</div>
  </nav>

  <main>
    <h1>SQL <span>IN</span> 转换器</h1>
    <div class="sub">粘贴 → 去换行去符号 → 加逗号（默认不加引号）→ 复制进 IN ( ... )</div>

    <div class="bar">
      <div class="quote-options" role="radiogroup" aria-label="引号">
        <span>引号</span>
        <label><input type="radio" name="quote" value="" checked>不加引号</label>
        <label><input type="radio" name="quote" value="'">单引号</label>
        <label><input type="radio" name="quote" value='"'>双引号</label>
      </div>
      <label><input type="checkbox" id="trim" checked> 去首尾空白</label>
      <label><input type="checkbox" id="dedup" checked> 去重</label>
      <label><input type="checkbox" id="sort"> 排序</label>
      <label>分隔
        <select id="split">
          <option value="any">任意空白 / 逗号 / 顿号 / 分号</option>
          <option value="line">按行</option>
          <option value="comma">按逗号</option>
        </select>
      </label>
      <label>换行
        <select id="wrap">
          <option value="none">不换行</option>
          <option value="10">每 10 个换行</option>
          <option value="5">每 5 个换行</option>
        </select>
      </label>
      <label><input type="checkbox" id="stmt" checked> 补 SELECT ... IN ( )</label>
      <label><input type="checkbox" id="esc" checked> 转义内部引号</label>
    </div>

    <div class="wrap">
      <section class="pane">
        <header><span>输入</span><b id="count">0 项</b></header>
        <textarea id="input" aria-label="输入待转换的值" spellcheck="false" placeholder="一行一个，或者直接粘一大坨：
1001
1002
'1003'
「1004」, 1005;"></textarea>
      </section>
      <section class="pane">
        <header><span>输出</span><button class="ghost" id="copy" style="padding:3px 12px;font-size:11px">复制</button></header>
        <div class="out" id="output" tabindex="0" aria-label="SQL 转换结果"><em>实时转换…</em></div>
      </section>
    </div>

    <span class="status" id="status"></span>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const input = $('input'), output = $('output'), count = $('count'), status = $('status');

// 常见包裹符号，成对剥掉
const WRAPS = /^[\s'"`‘’“”「」『』【】\[\]()<>]+|[\s'"`‘’“”「」『』【】\[\]()<>]+$/g;

function convert() {
  const raw = input.value;
  const mode = $('split').value;
  const q = document.querySelector('input[name="quote"]:checked').value;
  const doTrim = $('trim').checked, doDedup = $('dedup').checked, doSort = $('sort').checked;
  const wrapEvery = parseInt($('wrap').value, 10) || 0;
  const doStmt = $('stmt').checked, doEsc = $('esc').checked;

  let items;
  if (mode === 'line')       items = raw.split(/\r?\n/);
  else if (mode === 'comma') items = raw.split(/[,，、;；]+/);
  else                       items = raw.split(/[\s,，、;；]+/);

  items = items.map(s => doTrim ? s.trim() : s).filter(s => s.length);

  // 剥掉用户从 Excel / 日志里带过来的包裹符号，避免变成 "''1001''"
  items = items.map(s => s.replace(WRAPS, '')).filter(s => s.length);

  if (doDedup) items = [...new Set(items)];
  if (doSort)  items = items.sort((a, b) => a.localeCompare(b, 'zh-CN', { numeric: true }));

  count.textContent = items.length + ' 项';
  if (!items.length) { output.innerHTML = '<em>实时转换…</em>'; return; }

  const cells = items.map(s => {
    if (!q) return s;
    const body = doEsc ? s.replaceAll(q, q + q) : s;
    return q + body + q;
  });

  let text;
  if (wrapEvery > 0) {
    const lines = [];
    for (let i = 0; i < cells.length; i += wrapEvery) lines.push(cells.slice(i, i + wrapEvery).join(', '));
    text = lines.join(',\n');
  } else {
    text = cells.join(', ');
  }

  if (doStmt) text = 'SELECT * FROM 表名 WHERE 字段 IN (\n' + text + '\n);';
  output.textContent = text;
}

input.addEventListener('input', convert);
document.querySelectorAll('input,select').forEach(el => el.addEventListener('change', convert));

$('copy').addEventListener('click', async () => {
  const text = output.textContent;
  if (!text || text.startsWith('实时转换')) return;
  try { await navigator.clipboard.writeText(text); }
  catch {
    const r = document.createRange(); r.selectNodeContents(output);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    document.execCommand('copy'); sel.removeAllRanges();
  }
  status.textContent = '已复制 ' + count.textContent;
  status.classList.add('on');
  clearTimeout(status._t);
  status._t = setTimeout(() => status.classList.remove('on'), 1400);
});

// 自检：默认设置下的核心行为
(function selfTest() {
  const cases = [
    ["1001\n1002\n'1003'\n「1004」, 1005;", "SELECT * FROM 表名 WHERE 字段 IN (\n1001, 1002, 1003, 1004, 1005\n);"],
    ["a\n\na\n b ", "SELECT * FROM 表名 WHERE 字段 IN (\na, b\n);"],
  ];
  input.value = cases[0][0]; convert();
  console.assert(output.textContent === cases[0][1], 'case 1 失败:', output.textContent);
  input.value = cases[1][0]; convert();
  console.assert(output.textContent === cases[1][1], 'case 2 失败:', output.textContent);
  input.value = ''; convert();
})();
</script>
</body>
</html>
