  <main>
    <div class="page-heading">
      <div><h1>SQL IN 转换</h1><p class="sub">把零散的值，整理成可直接使用的查询。</p></div>
      <span class="local-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>仅在本地处理</span>
    </div>
    <div class="bar sql-settings">
      <div class="settings-row" role="group" aria-label="输出格式">
      <div class="quote-options" role="radiogroup" aria-label="引号">
        <span>引号</span>
        <div class="segments">
          <label><input type="radio" name="quote" value="" checked>不加引号</label>
          <label><input type="radio" name="quote" value="'">单引号</label>
          <label><input type="radio" name="quote" value='"'>双引号</label>
        </div>
      </div>
      <label><input type="checkbox" id="dedup" checked>去重</label>
      <label><input type="checkbox" id="stmt" checked>生成 SELECT 语句</label>
      </div>
      <div class="settings-row" role="group" aria-label="分隔、换行与文本清理">
        <label>分隔方式 <select id="split">
          <option value="any">空白、逗号、顿号或分号</option>
          <option value="line">按行</option><option value="comma">按逗号</option>
        </select></label>
        <label>结果换行 <select id="wrap">
          <option value="none">不换行</option><option value="10">每 10 个换行</option><option value="5">每 5 个换行</option>
        </select></label>
        <label><input type="checkbox" id="trim" checked>去首尾空白</label>
        <label><input type="checkbox" id="sort">排序</label>
        <label><input type="checkbox" id="esc" checked>转义内部引号</label>
      </div>
    </div>
    <div class="wrap">
      <section class="pane">
        <header><span>输入</span><b id="count">0 项</b></header>
        <textarea id="input" aria-label="输入待转换的值" spellcheck="false" placeholder="粘贴列表，每行一个值，也可以用逗号分隔。

1001
1002
'1003'
「1004」, 1005;"></textarea>
      </section>
      <section class="pane">
        <header><span>输出</span><button class="primary-copy" id="copy" disabled title="请先输入待转换的值">复制结果</button></header>
        <div class="out" id="output" tabindex="0" aria-label="SQL 转换结果"><em>实时转换…</em></div>
      </section>
    </div>

    <span class="status" id="status" role="status" aria-live="polite"></span>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const input = $('input'), output = $('output'), count = $('count'), status = $('status');

// 常见包裹符号，成对剥掉
const WRAPS = /^[\s'"`‘’“”「」『』【】\[\]()<>]+|[\s'"`‘’“”「」『』【】\[\]()<>]+$/g;

function convert() {
  const raw = input.value;
  const mode = $('split').value;
  const q = document.querySelector('input[name="quote"]:checked').value;
  const doTrim = $('trim').checked, doDedup = $('dedup').checked, doSort = $('sort').checked;
  const wrapEvery = parseInt($('wrap').value, 10) || 0;
  const doStmt = $('stmt').checked, doEsc = $('esc').checked;

  let items;
  if (mode === 'line')       items = raw.split(/\r?\n/);
  else if (mode === 'comma') items = raw.split(/[,，、;；]+/);
  else                       items = raw.split(/[\s,，、;；]+/);

  items = items.map(s => doTrim ? s.trim() : s).filter(s => s.length);

  // 剥掉用户从 Excel / 日志里带过来的包裹符号，避免变成 "''1001''"
  items = items.map(s => s.replace(WRAPS, '')).filter(s => s.length);

  if (doDedup) items = [...new Set(items)];
  if (doSort)  items = items.sort((a, b) => a.localeCompare(b, 'zh-CN', { numeric: true }));

  count.textContent = items.length + ' 项';
  $('copy').disabled = !items.length;
  $('copy').title = items.length ? '复制完整结果' : '请先输入待转换的值';
  $('copy').textContent = '复制结果';
  status.classList.remove('on');
  if (!items.length) { output.innerHTML = '<em>在左侧粘贴内容，结果会显示在这里。</em>'; return; }

  const cells = items.map(s => {
    if (!q) return s;
    const body = doEsc ? s.replaceAll(q, q + q) : s;
    return q + body + q;
  });

  let text;
  if (wrapEvery > 0) {
    const lines = [];
    for (let i = 0; i < cells.length; i += wrapEvery) lines.push(cells.slice(i, i + wrapEvery).join(', '));
    text = lines.join(',\n');
  } else {
    text = cells.join(', ');
  }

  if (doStmt) text = 'SELECT * FROM 表名 WHERE 字段 IN (\n' + text + '\n);';
  output.textContent = text;
}

input.addEventListener('input', convert);
document.querySelectorAll('input,select').forEach(el => el.addEventListener('change', convert));

$('copy').addEventListener('click', async () => {
  const text = output.textContent;
  if ($('copy').disabled) return;
  const copiedCount = count.textContent;
  $('copy').disabled = true;
  const pending = setTimeout(() => { $('copy').textContent = '复制中…'; }, 300);
  try {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const r = document.createRange(); r.selectNodeContents(output);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      try { if (!document.execCommand('copy')) throw new Error('copy failed'); }
      finally { sel.removeAllRanges(); }
    }
    $('copy').textContent = '已复制';
    status.className = 'status on';
    status.textContent = '已复制 ' + copiedCount;
  } catch {
    $('copy').textContent = '重试复制';
    status.className = 'status on err';
    status.textContent = '复制失败，请选中右侧结果手动复制。';
  } finally {
    clearTimeout(pending);
    $('copy').disabled = count.textContent === '0 项';
  }
  clearTimeout(status._t);
  status._t = setTimeout(() => status.classList.remove('on'), 3000);
});

// 自检：默认设置下的核心行为
(function selfTest() {
  const cases = [
    ["1001\n1002\n'1003'\n「1004」, 1005;", "SELECT * FROM 表名 WHERE 字段 IN (\n1001, 1002, 1003, 1004, 1005\n);"],
    ["a\n\na\n b ", "SELECT * FROM 表名 WHERE 字段 IN (\na, b\n);"],
  ];
  input.value = cases[0][0]; convert();
  console.assert(output.textContent === cases[0][1], 'case 1 失败:', output.textContent);
  input.value = cases[1][0]; convert();
  console.assert(output.textContent === cases[1][1], 'case 2 失败:', output.textContent);
  input.value = ''; convert();
})();
</script>
</body>
</html>
