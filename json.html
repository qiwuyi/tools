<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON 格式化 · Tools</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand"><b>TOOLS</b> 工具箱</div>
    <a href="index.html"><span class="tag">⌂</span>全部工具</a>
    <a href="sql-in.html"><span class="tag">SQL</span>IN 转换器</a>
    <a href="json.html" class="on"><span class="tag">{}</span>JSON 格式化</a>
    <a href="url.html"><span class="tag">%</span>URL 转义</a>
    <div class="foot">单文件 / 纯本地<br>无依赖 · 无上传</div>
  </nav>

  <main>
    <h1>JSON <span>格式化</span></h1>
    <div class="sub">美化 / 压缩 / 转义反转义 / 校验定位 / RPC 日志拆解 / 生成 YAML·Go·Java·Python·TS</div>

    <div class="bar">
      <label>输出格式
        <select id="mode">
          <option value="pretty">JSON 美化</option>
          <option value="min">JSON 压缩</option>
          <option value="escape">转义为字符串</option>
          <option value="unescape">反转义字符串</option>
          <option value="rpc">RPC 日志拆解</option>
          <option value="yaml">YAML</option>
          <option value="go">Go struct</option>
          <option value="java">Java 类</option>
          <option value="python">Python dataclass</option>
          <option value="ts">TypeScript interface</option>
        </select>
      </label>
      <label>缩进
        <select id="indent">
          <option value="2">2 空格</option>
          <option value="4">4 空格</option>
          <option value="tab">Tab</option>
        </select>
      </label>
      <label><input type="checkbox" id="sortkey"> 按 key 排序</label>
      <label>根类型名 <input type="text" id="root" value="Root" size="8"></label>
    </div>

    <div class="wrap">
      <section class="pane">
        <header><span>输入</span><b id="state">等待输入</b></header>
        <textarea id="input" spellcheck="false" placeholder='{"id":1001,"tags":["a","b"],"ok":true}'></textarea>
      </section>
      <section class="pane">
        <header><span>输出</span><button class="ghost" id="copy" style="padding:3px 12px;font-size:11px">复制</button></header>
        <pre class="out" id="output"><em>实时转换…</em></pre>
      </section>
    </div>

    <span class="status" id="status"></span>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const input = $('input'), output = $('output'), state = $('state'), status = $('status');

const pad = () => $('indent').value === 'tab' ? '\t' : ' '.repeat(+$('indent').value);
const cap = s => String(s).replace(/[^\w]+(\w)/g, (_, c) => c.toUpperCase()).replace(/^\w/, c => c.toUpperCase()) || 'Item';

/* ---------- 解析 ---------- */
function parse(text) {
  let obj = JSON.parse(text);
  if ($('sortkey').checked) obj = sortDeep(obj);
  return obj;
}
function sortDeep(v) {
  if (Array.isArray(v)) return v.map(sortDeep);
  if (v && typeof v === 'object') {
    const o = {};
    for (const k of Object.keys(v).sort()) o[k] = sortDeep(v[k]);
    return o;
  }
  return v;
}
// 把 "position 37" / "(line 3 column 5)" 变成人能看懂的位置
function locate(text, err) {
  const lineCol = /line (\d+) column (\d+)/.exec(err.message);
  if (lineCol) return `第 ${lineCol[1]} 行 第 ${lineCol[2]} 列`;
  const pos = /position (\d+)/.exec(err.message);
  if (pos) {
    const before = text.slice(0, +pos[1]);
    return `第 ${before.split('\n').length} 行 第 ${pos[1] - before.lastIndexOf('\n')} 列`;
  }
  return '';
}

/* ---------- RPC 日志（Tmall / neuron 网关风格） ----------
   请求Tmall.method(X).request({...}).response({...}).error(<nil>).latency(276ms)
   整行不是 JSON，拆出 request / response 两段再各自 parse。 */
const RPC_HEAD = /^\s*请求?\s*([A-Za-z_][\w.]*)\(([^()]*)\)/;

// 从 start 处的 { 或 [ 起，按配平取出一整段 JSON 文本（字符串里的括号不算）
function balanced(text, start) {
  const open = text[start], close = open === '{' ? '}' : ']';
  let depth = 0, inStr = false, q = '', esc = false;
  for (let i = start; i < text.length; i++) {
    const c = text[i];
    if (inStr) {
      if (esc) esc = false;
      else if (c === '\\') esc = true;
      else if (c === q) inStr = false;
      continue;
    }
    if (c === '"') { inStr = true; q = c; continue; }
    if (c === open) depth++;
    else if (c === close && !--depth) return text.slice(start, i + 1);
  }
  return null;
}

function rpcParts(text) {
  if (!/\.request\s*\(/.test(text) || !/\.response\s*\(/.test(text)) return null;
  const head = RPC_HEAD.exec(text);
  if (!head) return null;

  const argAt = marker => {                       // 取 marker 后紧跟的那段 JSON 参数
    const i = text.indexOf(marker);
    if (i < 0) return null;
    let j = i + marker.length;
    while (j < text.length && /\s/.test(text[j])) j++;
    if (text[j] !== '{' && text[j] !== '[') return null;   // 参数不是 JSON
    return balanced(text, j);
  };

  const resRaw = argAt('.response(');
  if (!resRaw) return null;
  const reqRaw = argAt('.request(');
  const response = JSON.parse(resRaw);
  const request = reqRaw ? JSON.parse(reqRaw) : null;
  const pick = re => (re.exec(text) || [])[1];

  return {
    service: head[1], arg: head[2], request, response,
    error: pick(/\.error\(([^)]*)\)/),
    latency: pick(/\.latency\(([^)]*)\)/),
    // 生成器/YAML 等模式默认针对 response.body（业务数据），没有就退到 response
    root: (response && response.body && typeof response.body === 'object') ? response.body : response,
  };
}

function rpcReport(p, I) {
  const meta = [];
  if (p.response.statusCode != null) meta.push('statusCode ' + p.response.statusCode);
  if (p.response.body && p.response.body.requestId) meta.push('requestId ' + p.response.body.requestId);
  if (p.latency) meta.push('latency ' + p.latency);
  if (p.error != null) meta.push('error ' + p.error);
  const L = ['# ' + p.service + '(' + p.arg + ')'];
  if (meta.length) L.push(meta.join('  ·  '));
  if (p.request) L.push('', '## request', JSON.stringify(p.request, null, I));
  L.push('', '## response', JSON.stringify(p.response, null, I));
  return L.join('\n');
}

/* ---------- YAML ---------- */
const yamlScalar = v => {
  if (v === null) return 'null';
  if (typeof v === 'string') {
    const plain = /^[A-Za-z0-9_][\w\-.\/ ]*$/.test(v) && !/^(true|false|null|yes|no|on|off)$/i.test(v);
    return plain ? v : JSON.stringify(v);
  }
  return String(v);
};
const yamlKey = k => /^[A-Za-z_][\w-]*$/.test(k) ? k : JSON.stringify(k);
function yaml(v, p = '') {
  const I = '  ';
  if (Array.isArray(v)) {
    if (!v.length) return '[]';
    return v.map(x => {
      if (x === null || typeof x !== 'object') return p + '- ' + yamlScalar(x);
      const body = yaml(x, p + I).replace(new RegExp('^' + p + I), '');
      return p + '- ' + body;
    }).join('\n');
  }
  if (v && typeof v === 'object') {
    const ks = Object.keys(v);
    if (!ks.length) return '{}';
    return ks.map(k => {
      const x = v[k];
      if (x === null || typeof x !== 'object') return p + yamlKey(k) + ': ' + yamlScalar(x);
      if (!Object.keys(x).length) return p + yamlKey(k) + ': ' + (Array.isArray(x) ? '[]' : '{}');
      return p + yamlKey(k) + ':\n' + yaml(x, p + I);
    }).join('\n');
  }
  return p + yamlScalar(v);
}

/* ---------- Go ---------- */
function goStruct(v, name, nested) {
  const fields = Object.entries(v).map(([k, val]) =>
    `\t${cap(k)} ${goType(val, name + cap(k), nested)} \`json:"${k}"\``);
  return `type ${name} struct {\n${fields.join('\n')}\n}`;
}
function goType(v, name, nested) {
  if (v === null) return 'interface{}';
  if (Array.isArray(v)) return '[]' + (v.length ? goType(v[0], name + 'Item', nested) : 'interface{}');
  if (typeof v === 'object') { nested.push(goStruct(v, name, nested)); return name; }
  if (typeof v === 'number') return Number.isInteger(v) ? 'int64' : 'float64';
  if (typeof v === 'boolean') return 'bool';
  return 'string';
}

/* ---------- Java ---------- */
const jid = s => String(s).replace(/[^\w$]/g, '_');
function javaClass(v, name, nested) {
  const fields = Object.entries(v).map(([k, val]) =>
    `    private ${javaType(val, name + cap(k), nested)} ${jid(k)};`);
  return `public class ${name} {\n${fields.join('\n')}\n}`;
}
function javaType(v, name, nested) {
  if (v === null) return 'Object';
  if (Array.isArray(v)) return 'List<' + (v.length ? javaType(v[0], name + 'Item', nested) : 'Object') + '>';
  if (typeof v === 'object') { nested.push(javaClass(v, name, nested)); return name; }
  if (typeof v === 'number') return Number.isInteger(v) ? 'long' : 'double';
  if (typeof v === 'boolean') return 'boolean';
  return 'String';
}

/* ---------- Python ---------- */
const pid = s => String(s).replace(/[^\w]/g, '_');
function pyClass(v, name, nested) {
  const fields = Object.entries(v).map(([k, val]) =>
    `    ${pid(k)}: ${pyType(val, name + cap(k), nested)}`);
  return `@dataclass\nclass ${name}:\n${fields.join('\n')}`;
}
function pyType(v, name, nested) {
  if (v === null) return 'Any';
  if (Array.isArray(v)) return 'List[' + (v.length ? pyType(v[0], name + 'Item', nested) : 'Any') + ']';
  if (typeof v === 'object') { nested.push(pyClass(v, name, nested)); return name; }
  if (typeof v === 'number') return Number.isInteger(v) ? 'int' : 'float';
  if (typeof v === 'boolean') return 'bool';
  return 'str';
}

/* ---------- TypeScript ---------- */
function tsInterface(v, name, nested) {
  const fields = Object.entries(v).map(([k, val]) =>
    `  ${/^[A-Za-z_$][\w$]*$/.test(k) ? k : JSON.stringify(k)}: ${tsType(val, name + cap(k), nested)};`);
  return `export interface ${name} {\n${fields.join('\n')}\n}`;
}
function tsType(v, name, nested) {
  if (v === null) return 'any';
  if (Array.isArray(v)) return (v.length ? tsType(v[0], name + 'Item', nested) : 'any') + '[]';
  if (typeof v === 'object') { nested.push(tsInterface(v, name, nested)); return name; }
  if (typeof v === 'number') return 'number';
  if (typeof v === 'boolean') return 'boolean';
  return 'string';
}

// 统一：递归生成 [根定义, ...嵌套定义] 的字符串
function typed(make, obj, name) {
  const nested = [];
  const root = make(obj, name, nested);
  return [root, ...nested.reverse()].join('\n\n');
}

/* ---------- 主流程 ---------- */
function render() {
  const raw = input.value;
  status.className = 'status';
  if (!raw.trim()) { state.textContent = '等待输入'; output.innerHTML = '<em>实时转换…</em>'; return; }
  const mode = $('mode').value;

  if (mode === 'unescape') {
    let s = raw.trim();
    try { s = JSON.parse(s); }            // "{\"a\":1}" → {"a":1}
    catch { s = s.replace(/\\(["'\\/bfnrtu])/g, (_, c) => ({ n: '\n', t: '\t', r: '\r', b: '\b', f: '\f' }[c] ?? c)); }
    output.textContent = s;
    state.textContent = s.length + ' 字符';
    return;
  }

  // RPC 日志（请求Tmall.x().request(..).response(..)）：拆包后喂给下面所有模式
  // 生成器 / YAML 默认针对 response.body，是最常用的业务数据
  let obj, rpcInfo = null;
  try { obj = parse(raw); }
  catch (e) {
    rpcInfo = rpcParts(raw);                    // 不是 JSON 就试试 RPC 日志
    if (!rpcInfo) {
      state.textContent = '✗ 无法解析';
      output.innerHTML = '<em>既不是 JSON，也不是 RPC 日志</em>';
      status.textContent = (locate(raw, e) || '') + (locate(raw, e) ? ' · ' : '')
        + e.message.replace(/^JSON\.parse: /, '');
      status.classList.add('on', 'err');
      return;
    }
    obj = rpcInfo.root;
    if ($('sortkey').checked) obj = sortDeep(obj);
  }

  const name = cap($('root').value.trim() || 'Root');
  const I = pad();
  const map = {
    pretty: () => JSON.stringify(obj, null, I),
    min: () => JSON.stringify(obj),
    escape: () => JSON.stringify(JSON.stringify(obj)),
    yaml: () => yaml(obj),
    go: () => typed(goStruct, obj, name),
    java: () => 'import java.util.List;\n\n' + typed(javaClass, obj, name),
    python: () => 'from dataclasses import dataclass\nfrom typing import Any, List\n\n' + typed(pyClass, obj, name),
    ts: () => typed(tsInterface, obj, name),
  };
  const text = mode === 'rpc' ? rpcReport(rpcInfo || { service: '(普通 JSON)', arg: '', request: null, response: obj, error: null, latency: null }, I) : map[mode]();
  output.textContent = text;
  state.textContent = rpcInfo ? '✓ RPC 日志' : '✓ 合法 JSON';
  status.textContent = '已生成 · ' + text.length + ' 字符';
  status.classList.add('on');
}

input.addEventListener('input', render);
document.querySelectorAll('input,select').forEach(el => el.addEventListener('change', render));

$('copy').addEventListener('click', async () => {
  const text = output.textContent;
  if (!text || text.startsWith('实时转换')) return;
  try { await navigator.clipboard.writeText(text); }
  catch {
    const r = document.createRange(); r.selectNodeContents(output);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    document.execCommand('copy'); sel.removeAllRanges();
  }
  status.className = 'status on';
  status.textContent = '已复制';
});

// 自检：解析 / 定位 / 各生成器
(function selfTest() {
  const ok = (cond, msg, got) => console.assert(cond, msg, got);
  input.value = '{"b":1,"a":[{"x":true}]}';
  $('mode').value = 'pretty'; $('indent').value = '2'; $('sortkey').checked = true; render();
  ok(output.textContent === '{\n  "a": [\n    {\n      "x": true\n    }\n  ],\n  "b": 1\n}', 'pretty+sort', output.textContent);

  $('sortkey').checked = false;
  $('mode').value = 'escape'; render();
  ok(output.textContent === '"{\\"b\\":1,\\"a\\":[{\\"x\\":true}]}"', 'escape', output.textContent);
  input.value = output.textContent; $('mode').value = 'unescape'; render();
  ok(output.textContent === '{"b":1,"a":[{"x":true}]}', 'unescape', output.textContent);

  input.value = '{"id":1001,"price":9.5,"ok":true,"tags":["a"],"owner":{"n":"z"},"nil":null}';
  $('mode').value = 'go'; render();
  ok(output.textContent.includes('type Root struct') && output.textContent.includes('`json:"id"`')
    && output.textContent.includes('int64') && output.textContent.includes('float64')
    && output.textContent.includes('[]string') && output.textContent.includes('type RootOwner struct'), 'go', output.textContent);
  $('mode').value = 'java'; render(); ok(output.textContent.includes('private long id;'), 'java', output.textContent);
  $('mode').value = 'python'; render(); ok(output.textContent.includes('class Root:') && output.textContent.includes('id: int'), 'python', output.textContent);
  $('mode').value = 'ts'; render(); ok(output.textContent.includes('export interface Root') && output.textContent.includes('tags: string[];'), 'ts', output.textContent);
  $('mode').value = 'yaml'; render();
  ok(output.textContent === 'id: 1001\nprice: 9.5\nok: true\ntags:\n  - a\nowner:\n  n: z\nnil: null', 'yaml', output.textContent);

  input.value = '{"a":1,}';
  $('mode').value = 'pretty'; render();
  ok(state.textContent === '✗ 无法解析' && status.classList.contains('err') && /^第 \d+ 行 第 \d+ 列/.test(status.textContent), 'error locate', status.textContent);

  // RPC 日志：真实 Tmall 网关格式（含嵌套括号、转义引号、<nil>）
  const RPC = '请求Tmall.method(ListSelectionProductSaleInfos).request({"body":{"divisionCode":"441901","productIds":["763604494735802368","891197557832925184"],"purchaserId":"PID2200006282"}}).response({"headers":{"server":"istio-envoy"},"statusCode":200,"body":{"productSaleInfos":[{"canSell":false,"fuzzyQuantity":"无货","productId":"891197557832925184","skus":[{"price":2499,"title":"东方树叶(茉莉) \\"mini\\""}],"quantity":-1}],"requestId":"01A12A7D"}}).error(<nil>).latency(276ms)';

  input.value = RPC; $('mode').value = 'rpc'; $('sortkey').checked = false; render();
  ok(state.textContent === '✓ RPC 日志', 'rpc detected', state.textContent);
  ok(output.textContent.includes('# Tmall.method(ListSelectionProductSaleInfos)'), 'rpc head', output.textContent.slice(0, 120));
  ok(output.textContent.includes('statusCode 200') && output.textContent.includes('requestId 01A12A7D')
    && output.textContent.includes('latency 276ms') && output.textContent.includes('error <nil>'), 'rpc meta', output.textContent.slice(0, 200));
  ok(output.textContent.includes('## request') && output.textContent.includes('## response'), 'rpc sections', '');
  ok(output.textContent.includes('PID2200006282') && output.textContent.includes('东方树叶(茉莉) \\"mini\\"'), 'rpc body intact', '');

  // 同一个日志：生成器模式自动作用在 response.body 上
  input.value = RPC;
  $('mode').value = 'pretty'; render();
  ok(!output.textContent.includes('"headers"') && output.textContent.includes('productSaleInfos'), 'rpc->pretty uses body', output.textContent.slice(0, 80));
  $('mode').value = 'go'; render();
  ok(output.textContent.includes('type Root struct') && output.textContent.includes('ProductSaleInfos []'), 'rpc->go', output.textContent.slice(0, 200));
  $('mode').value = 'yaml'; render();
  ok(output.textContent.startsWith('productSaleInfos:'), 'rpc->yaml', output.textContent.slice(0, 60));

  // 括号配平不受字符串里的括号干扰
  input.value = '请求Tmall.m(X).request({"a":"}{)("}).response({"b":1}).error(<nil>).latency(9ms)';
  $('mode').value = 'rpc'; render();
  ok(state.textContent === '✓ RPC 日志' && output.textContent.includes('"a": "}{)("'), 'brace-in-string', output.textContent.slice(0, 200));

  // RPC 模式下粘普通 JSON：不报错，输出单段 response
  input.value = '{"a":1}'; $('mode').value = 'rpc'; render();
  ok(state.textContent === '✓ 合法 JSON' && output.textContent.includes('## response') && output.textContent.includes('"a": 1'), 'rpc mode on plain json', output.textContent.slice(0, 120));

  input.value = ''; $('sortkey').checked = true; render();
})();
</script>
</body>
</html>
