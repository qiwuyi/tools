<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URL 转换 · Tools</title>
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="apple.css">
</head>
<body class="url-page">
<div class="app">
  <nav class="side" aria-label="工具导航">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="15" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/></svg></span>工具箱</div>
    <div class="nav-links">
    <a href="index.html"><span class="tag" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="15" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="15" width="6" height="6" rx="1.5"/><rect x="15" y="15" width="6" height="6" rx="1.5"/></svg></span>全部工具</a>
    <a href="sql-in.html"><span class="tag" aria-hidden="true"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg></span>SQL IN 转换</a>
    <a href="json.html"><span class="tag" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3H6v7l-3 2 3 2v7h2M16 3h2v7l3 2-3 2v7h-2"/></svg></span>JSON 格式化</a>
    <a href="url.html" class="on" aria-current="page"><span class="tag" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m10 14 4-4M8 16l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0M16 8l1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 0) scale(.92)"/></svg></span>URL 转换</a>
    <a href="timestamp.html"><span class="tag" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>时间戳转换</a>
    </div>
    <div class="foot">本地处理 · 无需上传</div>
  </nav>
  <main>
    <div class="page-heading"><div><h1>URL 转换</h1><p class="sub">粘贴一次，找到你需要的格式。</p></div><span class="local-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>仅在本地处理</span></div>
    <section class="pane source">
      <header><label for="input">输入 URL 或文本</label><span id="state">等待输入</span></header>
      <textarea id="input" spellcheck="false" placeholder="粘贴 URL、带 \u0026 / &amp;amp; 的链接，或 % 编码文本…"></textarea>
    </section>
    <div class="utility-row">
    <section class="options" aria-label="转换选项">
      <div class="settings" role="group" aria-label="转换选项">
        <label><input type="checkbox" id="ent" checked>还原 JSON / Unicode 和 HTML 转义</label>
        <label><input type="checkbox" id="plus">表单格式：空格 ↔ +（编码 / 解码结果）</label>
        <label><input type="checkbox" id="parsed" checked>显示查询参数表</label>
      </div>
      <details class="format-help">
        <summary>查看六种转换说明</summary>
        <dl class="help" id="help"></dl>
      </details>
    </section>
    <p class="notice" id="notice">粘贴后生成全部结果；每项都可以直接复制。</p>
    </div>
    <div class="results" id="results"></div>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <details class="q" id="qbox" hidden>
      <summary id="qtitle">查询参数</summary>
      <div id="qbody"></div>
    </details>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
const input = $('input'), state = $('state'), status = $('status');
const HTML = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const unHTML = { amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'", apos: "'", nbsp: '\u00a0' };
const esc = s => String(s).replace(/[&<>"']/g, c => HTML[c]);

function decodeEntities(s) {
  return s.replace(/&(#x[0-9a-f]+|#\d+|[a-z]+);/gi, (m, body) => {
    if (body[0] !== '#') return Object.hasOwn(unHTML, body.toLowerCase()) ? unHTML[body.toLowerCase()] : m;
    const hex = /^#x/i.test(body);
    const n = parseInt(body.slice(hex ? 2 : 1), hex ? 16 : 10);
    return n > 0 && n <= 0x10FFFF && !(n >= 0xD800 && n <= 0xDFFF) ? String.fromCodePoint(n) : m;
  });
}

// 每次只还原一层文本转义；不递归展开参数值。
function restoreText(s, steps) {
  const before = s;
  if (s.startsWith('"') && s.endsWith('"')) {
    try { const value = JSON.parse(s); if (typeof value === 'string') s = value; } catch { /* 保留不完整 JSON */ }
  } else {
    s = s.replace(/\\(?:u([0-9a-f]{4})|([\\/]))/gi, (m, hex, slash) => hex ? String.fromCharCode(parseInt(hex, 16)) : slash);
  }
  if (s !== before) steps.push('JSON / Unicode 转义已还原');
  const decoded = decodeEntities(s);
  if (decoded !== s) steps.push('HTML 实体已还原');
  return decoded;
}

const isURL = s => /^(?:[a-z][a-z0-9+.-]*:\/\/|\/\/|[/?#])/i.test(s);
const isQuery = s => /^[^\s=&?#]+=[\s\S]*/.test(s);
const encodedURL = s => /^(?:https?%|%2f|%3f|%23|%25(?:2f|3f|23))/i.test(s);

function normalize(raw, restore = true) {
  const steps = [];
  let text = raw.trim();
  if (restore) text = restoreText(text, steps);
  // 仅剥离整条链接外面的百分号编码。识别到 URL / query 后立即停止，
  // 保留值内的 %26、%3D、%23、%2B、%25，避免改写参数边界或签名。
  for (let depth = 0; depth < 3 && !isURL(text) && !isQuery(text) && /%[0-9a-f]{2}/i.test(text); depth++) {
    let decoded;
    try { decoded = decodeURIComponent(text); }
    catch { steps.push('百分号编码不完整或不是有效 UTF-8，已保留原文'); break; }
    const whole = encodedURL(text) || isURL(decoded) || isQuery(decoded);
    if (depth > 0 && !whole) break;
    text = decoded;
    steps.push(whole ? '整条链接已解码一层' : '百分号文本已解码一层');
    if (restore) text = restoreText(text, steps);
    if (!whole) break;
  }
  return { text, steps };
}

// 保留已有的合法 %XX，避免整条 URL 编码时把 %26 变成 %2526。
function encodeURL(s) {
  return s.split(/(%[0-9a-f]{2})/gi).map(part => /^%[0-9a-f]{2}$/i.test(part) ? part : encodeURI(part)).join('');
}

const formats = [
  ['normal', '自动还原', '还原复制时的转义；保留 URL 参数值内的 % 编码与 +。'],
  ['uri', '整条 URL 编码', '保留 : / ? & = # 等结构；编码空格和中文，保留已有 %XX。'],
  ['component', '作为参数值编码', '把整个结果放进另一个链接的参数值时使用。'],
  ['decode', '百分号解码 · 阅读用', '展开所有 %XX；可能改变参数边界，请勿直接替换原链接。'],
  ['html', 'HTML 实体转义', '将原始输入中的 & < > 和引号转成实体，用于 HTML。'],
  ['htmlDecode', '仅 HTML 实体还原', '只处理原始输入中的 &amp; / &#38; 等实体。'],
];
$('results').innerHTML = formats.map(([id, title, hint]) => '<section class="pane result">'
  + '<header><h2 title="' + esc(hint) + '">' + esc(title) + '</h2><button class="ghost" id="copy-' + id + '" aria-label="复制' + esc(title) + '" disabled>复制</button></header>'
  + '<pre class="out" id="out-' + id + '" tabindex="0" aria-label="' + esc(title) + '结果" aria-describedby="help-' + id + '">等待粘贴输入…</pre></section>').join('');
$('help').innerHTML = formats.map(([id, title, hint]) => '<dt>' + esc(title) + '</dt><dd id="help-' + id + '">' + esc(hint) + '</dd>').join('');

function convert() {
  const raw = input.value;
  const normalized = normalize(raw, $('ent').checked);
  const src = normalized.text;
  const plus = $('plus').checked;
  const conversions = {
    normal: () => src,
    uri: () => { const s = encodeURL(src); return plus ? s.replace(/%20/g, '+') : s; },
    component: () => { const s = encodeURIComponent(src); return plus ? s.replace(/%20/g, '+') : s; },
    decode: () => decodeURIComponent(plus ? src.replace(/\+/g, ' ') : src),
    html: () => esc(raw.trim()),
    htmlDecode: () => decodeEntities(raw.trim()),
  };
  state.textContent = src ? raw.length + ' 字符 · 6 种结果' : '等待输入';
  status.className = 'status'; status.textContent = '';
  $('notice').textContent = !src ? '粘贴后生成全部结果；每项都可以直接复制。'
    : normalized.steps.length ? [...new Set(normalized.steps)].join('；')
    : isURL(src) || isQuery(src) ? '已识别 URL / 查询参数，自动还原结果保留现有参数编码。'
    : '未发现需要还原的转义，原文已保留；请按用途复制下方结果。';
  for (const [id] of formats) {
    const out = $('out-' + id), button = $('copy-' + id);
    out.className = 'out'; button.disabled = !src; button.textContent = '复制';
    button.title = src ? '复制此结果' : '请先粘贴输入';
    try { out.textContent = src ? conversions[id]() : '等待粘贴输入…'; }
    catch {
      out.textContent = '无法转换：请检查 %XX 是否完整、是否为有效 UTF-8，以及 Unicode 字符是否完整。其他结果仍可复制。';
      out.className = 'out error'; button.disabled = true; button.title = '请先修正编码错误';
    }
  }
  const p = src && $('parsed').checked ? parseURL(src) : null;
  $('qbox').hidden = !p;
  if (p) renderQuery(p);
}

// 参数表只读取自动还原结果；先分隔参数，再解码各个值。
function parseURL(s) {
  try {
    let u = null, qs = '', where = 'query';
    if (isQuery(s)) { qs = s; where = 'raw'; }
    else if (isURL(s) || /[/?#]/.test(s)) {
      u = new URL(s, 'https://url-tool.invalid/');
      qs = u.search.slice(1);
      if (!qs) {
        const hi = u.hash.indexOf('?');
        if (hi >= 0) { qs = u.hash.slice(hi + 1); where = 'hash'; }
      }
    }
    const params = [...new URLSearchParams(qs)];
    if (!params.length) return null;
    return { params, where };
  } catch { return null; }
}

function renderQuery(p) {
  const location = p.where === 'hash' ? ' · # 路由内' : p.where === 'raw' ? ' · 裸 query' : '';
  $('qtitle').textContent = p.params.length + ' 个查询参数' + location + '（值按表单规则解码，+ 显示为空格）';
  $('qbody').innerHTML = '<table><thead><tr><th scope="col">参数</th><th scope="col">值</th></tr></thead><tbody>'
    + p.params.map(([k, v]) => '<tr><td>' + esc(k) + '</td><td>' + esc(v) + '</td></tr>').join('') + '</tbody></table>';
}

for (const [id, title] of formats) {
  $('copy-' + id).addEventListener('click', async () => {
    const text = $('out-' + id).textContent;
    try {
      try { await navigator.clipboard.writeText(text); }
      catch {
        const area = document.createElement('textarea');
        area.value = text; area.style.position = 'fixed'; area.style.opacity = '0';
        document.body.append(area); area.select();
        try { if (!document.execCommand('copy')) throw new Error('copy failed'); }
        finally { area.remove(); $('copy-' + id).focus(); }
      }
      for (const [other] of formats) $('copy-' + other).textContent = '复制';
      $('copy-' + id).textContent = '已复制';
      status.className = 'status on'; status.textContent = '已复制：' + title;
    } catch {
      status.className = 'status on err'; status.textContent = '复制失败，请选中对应结果后手动复制。';
    }
  });
}
input.addEventListener('input', convert);
for (const id of ['ent', 'plus', 'parsed']) $(id).addEventListener('change', convert);
convert();
</script>
</body>
</html>
