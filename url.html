<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URL 转义 · Tools</title>
<link rel="stylesheet" href="shell.css">
<style>
.q{width:100%; max-width:1180px; margin-top:16px}
.q table{width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.q th,.q td{padding:8px 12px; border-bottom:1px solid var(--line); font-size:12px; text-align:left; word-break:break-all; vertical-align:top}
.q th{color:var(--dim); font-weight:500; letter-spacing:.1em; font-size:11px; text-transform:uppercase; background:#121821}
.q tr:last-child td{border-bottom:0}
.q td.k{color:var(--accent2); white-space:nowrap; width:1%}
.q td.v{color:var(--ink)}
.q h3{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:22px 0 8px; font-weight:500}
.q .empty{color:var(--dim); font-size:12px; padding:12px}
</style>
</head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand"><b>TOOLS</b> 工具箱</div>
    <a href="index.html"><span class="tag">⌂</span>全部工具</a>
    <a href="sql-in.html"><span class="tag">SQL</span>IN 转换器</a>
    <a href="json.html"><span class="tag">{}</span>JSON 格式化</a>
    <a href="url.html" class="on"><span class="tag">%</span>URL 转义</a>
    <div class="foot">单文件 / 纯本地<br>无依赖 · 无上传</div>
  </nav>

  <main>
    <h1>URL <span>转义</span></h1>
    <div class="sub">选好模式，左贴右取 —— 顺带拆查询参数（含 # 路由）与 &amp;amp; 反转义</div>

    <div class="bar">
      <label>模式
        <select id="mode">
          <option value="component">encodeURIComponent（参数值）</option>
          <option value="uri" selected>encodeURI（整条 URL）</option>
          <option value="decode">decodeURIComponent（解码）</option>
          <option value="html">HTML 实体转义</option>
          <option value="htmlDecode">HTML 实体反转义（&amp;amp; → &amp;）</option>
        </select>
      </label>
      <label><input type="checkbox" id="plus" checked> 空格转 + / + 转空格</label>
      <label><input type="checkbox" id="ent" checked> 顺带反转义 &amp;amp;</label>
      <label><input type="checkbox" id="parsed" checked> 解析查询参数表</label>
    </div>

    <div class="wrap">
      <section class="pane">
        <header><span>输入</span><b id="state">等待输入</b></header>
        <textarea id="input" spellcheck="false" placeholder="https://a.com/s?q=中文 关键词&t=1
或者粘 %E4%B8%AD%E6%96%87"></textarea>
      </section>
      <section class="pane">
        <header><span>输出</span><button class="ghost" id="copy" style="padding:3px 12px;font-size:11px">复制</button></header>
        <pre class="out" id="output"><em>实时转换…</em></pre>
      </section>
    </div>

    <section class="q" id="qbox" hidden>
      <h3 id="qtitle">查询参数</h3>
      <div id="qbody"></div>
    </section>

    <span class="status" id="status"></span>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const input = $('input'), output = $('output'), state = $('state'), status = $('status');

const HTML = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const unHTML = { amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'", apos: "'", nbsp: '\u00a0' };
const ENT = /&(?:amp|lt|gt|quot|apos|nbsp|#39);/i;

// HTML 实体反转义：命名实体 + &#39; + &#x27;
function decodeEntities(s) {
  return String(s).replace(/&(#x?[0-9a-f]+|[a-z]+);/gi, (m, body) => {
    if (body[0] === '#') {
      const hex = body[1] === 'x' || body[1] === 'X';   // body 形如 "#x42"，x 在第二位
      const n = parseInt(body.slice(hex ? 2 : 1), hex ? 16 : 10);
      return Number.isFinite(n) && n > 0 && n <= 0x10FFFF ? String.fromCodePoint(n) : m;
    }
    const k = body.toLowerCase();
    return k in unHTML ? unHTML[k] : m;
  });
}

function convert() {
  const raw = input.value;
  const plus = $('plus').checked;
  if (!raw) { state.textContent = '等待输入'; output.innerHTML = '<em>实时转换…</em>'; qbox.hidden = true; return; }
  const mode = $('mode').value;
  let src = mode === 'uri' ? raw : raw.trim();
  // 从 HTML 页面/日志里复制来的 URL 常带 &amp;，先还原再按模式处理
  if ($('ent').checked && mode !== 'html' && mode !== 'htmlDecode') src = decodeEntities(src);

  let text;
  try {
    if (mode === 'component') {
      text = encodeURIComponent(src);
      if (plus) text = text.replace(/%20/g, '+');
    } else if (mode === 'uri') {
      text = encodeURI(src);
      if (plus) text = text.replace(/%20/g, '+');
    } else if (mode === 'decode') {
      text = decodeURIComponent(plus ? src.replace(/\+/g, ' ') : src);
    } else if (mode === 'htmlDecode') {
      text = decodeEntities(src);
    } else {
      text = src.replace(/[&<>"']/g, c => HTML[c]);
    }
    status.className = 'status';
  } catch (e) {
    text = '';
    status.className = 'status on err';
    status.textContent = '解码失败：URI malformed（% 后面不是合法两位十六进制）';
  }

  output.textContent = text;
  state.textContent = '输出 ' + text.length + ' 字符';

  // 查询参数表：一直跟着「输入」走，而不是跟着输出（输出常常是转义后的形式）
  const p = $('parsed').checked ? parseURL(raw) : null;
  qbox.hidden = !p;
  if (p) renderQuery(p);
}

/* 解析查询参数：普通 query → hash 路由里的 query → 裸 query string
   顺带处理粘贴时被转义的 &amp;（从 HTML 页面/日志里复制常带这个） */
function parseURL(text) {
  let s = text.trim();
  const hadEnt = ENT.test(s);
  if (hadEnt) s = decodeEntities(s);              // 不处理的话会拆出 "amp;orderId"
  try {
    const isAbs = /^[a-z][a-z0-9+.-]*:\/\//i.test(s) || /^\/\//.test(s);
    let u = null, qs = '', where = 'query';
    if (isAbs || /[/?#]/.test(s)) {
      u = isAbs ? new URL(s) : new URL(s, 'http://x/');
      qs = u.search.slice(1);
      if (!qs) {                                   // SPA 把参数放在 # 后面：/v1/#/page?a=1&b=2
        const hi = u.hash.indexOf('?');
        if (hi >= 0) { qs = u.hash.slice(hi + 1); where = 'hash'; }
      }
    }
    if (!qs && /=/.test(s)) { qs = s.replace(/^[?#]/, ''); where = 'raw'; }
    const params = [...new URLSearchParams(qs)];
    if (!params.length) return null;
    return {
      base: u && u.origin !== 'http://x' ? u.origin : '',
      path: u ? u.pathname : '',
      route: u && u.hash && where === 'hash' ? u.hash.slice(0, u.hash.indexOf('?')) : '',
      params, where, hadEnt,
    };
  } catch { return null; }
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => HTML[c]); }
function renderQuery(p) {
  const loc = (p.base || p.path !== '/' ? (p.base + p.path) : '') + (p.route || '');
  const tags = p.where === 'hash' ? '（# 路由内）' : p.where === 'raw' ? '（裸 query）' : '';
  $('qtitle').textContent = (loc ? loc + ' · ' : '') + p.params.length + ' 个参数' + tags;
  if (p.hadEnt) $('qtitle').textContent += ' · 已反转义 &amp;';
  $('qbody').innerHTML = '<table><thead><tr><th>key</th><th>value</th></tr></thead><tbody>'
    + p.params.map(([k, v]) => `<tr><td class="k">${esc(k)}</td><td class="v">${esc(v)}</td></tr>`).join('')
    + '</tbody></table>';
}

input.addEventListener('input', convert);
$('mode').addEventListener('change', convert);
$('plus').addEventListener('change', convert);
$('ent').addEventListener('change', convert);
$('parsed').addEventListener('change', convert);

$('copy').addEventListener('click', async () => {
  const text = output.textContent;
  if (!text || text.startsWith('实时转换')) return;
  try { await navigator.clipboard.writeText(text); }
  catch {
    const r = document.createRange(); r.selectNodeContents(output);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    document.execCommand('copy'); sel.removeAllRanges();
  }
  status.className = 'status on';
  status.textContent = '已复制';
});

// 自检
(function selfTest() {
  const ok = (cond, msg, got) => console.assert(cond, msg, got);
  const type = s => { input.value = s; convert(); return output.textContent; };

  // 页面初始默认值（必须在改动任何控件之前断言）
  ok($('mode').value === 'uri', 'default mode is encodeURI', $('mode').value);
  ok($('plus').checked && $('ent').checked && $('parsed').checked, 'default checkboxes on', '');

  // 自检会来回改控件，先把初始状态存下来，跑完原样还原，免得用户首屏看到被改过的默认值
  const initial = { mode: $('mode').value, plus: $('plus').checked, ent: $('ent').checked, parsed: $('parsed').checked, input: input.value };

  $('mode').value = 'component'; $('plus').checked = false;
  ok(type('a b&c=d/中') === 'a%20b%26c%3Dd%2F%E4%B8%AD', 'component', output.textContent);
  $('plus').checked = true;
  ok(type('a b') === 'a+b', 'component+space', output.textContent);
  ok(type('a+b') === 'a%2Bb', 'component+literal-plus', output.textContent);
  input.value = 'a+b%20c'; $('mode').value = 'decode'; convert();
  ok(output.textContent === 'a b c', 'decode', output.textContent);
  $('mode').value = 'uri'; $('plus').checked = false;
  ok(type('https://a.com/s?q=中文 词&t=1') === 'https://a.com/s?q=%E4%B8%AD%E6%96%87%20%E8%AF%8D&t=1', 'uri', output.textContent);
  $('mode').value = 'html';
  ok(type('<a href="x">&') === '&lt;a href=&quot;x&quot;&gt;&amp;', 'html', output.textContent);
  $('mode').value = 'decode';
  ok(type('%E4%B8%AD') === '中', 'decode-utf8', output.textContent);

  // 参数表
  $('mode').value = 'component'; $('plus').checked = true; $('parsed').checked = true;
  input.value = 'https://a.com/s?q=%E4%B8%AD%E6%96%87&t=1&t=2'; convert();
  const rows = [...document.querySelectorAll('#qbody tr')].map(tr => tr.textContent);
  ok(!qbox.hidden && rows.join('|').includes('中文'), 'query table', rows.join('|'));
  ok(document.querySelectorAll('#qbody tbody tr').length === 3, 'query rows', rows.length);

  // HTML 实体反转义
  $('mode').value = 'htmlDecode';
  ok(type('a&amp;b&lt;c&gt;&quot;d&#39;e&nbsp;f') === 'a&b<c>"d\'e\u00a0f', 'htmlDecode', JSON.stringify(output.textContent));
  ok(type('&#65;&#x42;&#x4e2d;') === 'AB中', 'htmlDecode numeric', output.textContent);
  ok(type('&unknown; &amp') === '&unknown; &amp', 'htmlDecode leaves bad entities', output.textContent);

  // hash 路由里的 query + &amp;（用户实际那一条）
  $('mode').value = 'component'; $('ent').checked = true; $('parsed').checked = true;
  input.value = 'https://m.quanmaigo.com/v1/#/transferPage?appId=3&amp;orderId=20261014114050361598&amp;timestamp=1791949251&amp;brandId=1552&amp;sign=18ae59561f148996beb2ba192c24f6f2&amp;extra=qxfl';
  convert();
  const keys = [...document.querySelectorAll('#qbody td.k')].map(td => td.textContent);
  const vals = [...document.querySelectorAll('#qbody td.v')].map(td => td.textContent);
  ok(!qbox.hidden, 'hash route table shown', '');
  ok(keys.join(',') === 'appId,orderId,timestamp,brandId,sign,extra', 'hash keys (no amp;)', keys.join(','));
  ok(!keys.some(k => k.includes('amp;')), 'no amp; in keys', keys.join(','));
  ok(vals[1] === '20261014114050361598' && vals[5] === 'qxfl', 'hash values', vals.join(','));
  ok($('qtitle').textContent.includes('已反转义'), 'entity badge', $('qtitle').textContent);
  // 编码结果里 &amp; 已还原成 &，被正确编码为 %26
  ok(output.textContent.includes('%26orderId'), 'amp decoded before encode', output.textContent);

  // 关掉实体反转义时保持原样（用户想看到原始内容）；& 被编码成 %26，"amp;" 原样保留
  $('ent').checked = false; convert();
  ok(output.textContent.includes('%26amp%3BorderId'), 'entity toggle off', output.textContent.slice(0, 120));
  $('ent').checked = true;

  // 普通 query 与 SPA hash 互不干扰
  input.value = 'https://a.com/p?x=1#/route?y=2'; convert();
  const k2 = [...document.querySelectorAll('#qbody td.k')].map(td => td.textContent);
  ok(k2.join(',') === 'x', 'search wins over hash', k2.join(','));

  // 还原首屏状态
  $('mode').value = initial.mode; $('plus').checked = initial.plus;
  $('ent').checked = initial.ent; $('parsed').checked = initial.parsed;
  input.value = initial.input; convert();
  ok($('mode').value === 'uri', 'default restored after self-test', $('mode').value);
})();
</script>
</body>
</html>
